<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>コーチビデオ</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="コーチビデオ">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#141408">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxOTIgMTkyIj48cmVjdCB3aWR0aD0iMTkyIiBoZWlnaHQ9IjE5MiIgcng9IjQwIiBmaWxsPSIjMTQxNDA4Ii8+PHRleHQgeD0iOTYiIHk9IjEzMCIgZm9udC1zaXplPSI5NiIgdGV4dC1hbmNob3I9Im1pZGRsZSI+4pq+77iPPC90ZXh0Pjwvc3ZnPg==">
    <style>
        :root {
            --bg:         #0a0a06;
            --bar:        #171708;
            --btn:        #272710;
            --btn-bd:     #353518;
            --btn-act:    #3d4610;
            --btn-act-bd: #7a8c1a;
            --icon:       #b8a830;
            --icon-dim:   #68602a;
            --txt:        #808050;
            --sep:        #2a2a10;
            --play:       #20c818;
            --play-sh:    rgba(32,200,24,0.35);
            --red-btn:    #3a0808;
            --red-bd:     #6a1818;
            --red-ic:     #f87171;
            --sync-c:     #f97316;
        }
        * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
        body {
            background: var(--bg);
            color: var(--txt);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            height: 100dvh;
            display: flex; flex-direction: column;
            overflow: hidden; user-select: none;
        }

        /* ══ TOOLBAR ══ */
        #toolbar {
            height: 54px; min-height: 54px;
            background: var(--bar);
            border-bottom: 1px solid var(--sep);
            display: flex; align-items: center;
            padding: 0 8px; gap: 5px;
            flex-shrink: 0; overflow: hidden;
        }
        .tb-sep { width:1px; height:34px; background:var(--sep); flex-shrink:0; margin:0 1px; }
        .tb-btn {
            background:var(--btn); border:1px solid var(--btn-bd);
            color:var(--icon); height:40px; min-width:40px;
            border-radius:9px; font-size:17px; cursor:pointer;
            display:flex; align-items:center; justify-content:center;
            padding:0 10px; transition:all 0.13s; flex-shrink:0;
            white-space:nowrap;
        }
        .tb-btn.active { background:var(--btn-act); border-color:var(--btn-act-bd); color:#d4e040; }
        .tb-btn:active  { opacity:0.7; transform:scale(0.93); }

        /* Mode group */
        .mode-group { display:flex; background:var(--btn); border:1px solid var(--btn-bd); border-radius:10px; overflow:hidden; }
        .mode-btn {
            background:none; border:none; border-right:1px solid var(--btn-bd);
            color:var(--icon-dim); height:38px; padding:0 16px;
            font-size:13px; font-weight:700; cursor:pointer;
            letter-spacing:1px; transition:all 0.13s; white-space:nowrap;
        }
        .mode-btn:last-child { border-right:none; }
        .mode-btn.active    { background:var(--btn-act); color:#d4e040; border-color:var(--btn-act-bd); }
        .mode-btn:active    { opacity:0.7; }

        .tool-group { display:flex; gap:3px; }
        .tool-btn   { min-width:38px; height:38px; padding:0 8px; border-radius:8px; font-size:16px; }

        .color-strip { display:flex; gap:5px; align-items:center; padding:0 3px; }
        .cdot {
            width:20px; height:20px; border-radius:50%;
            border:2px solid transparent; cursor:pointer; flex-shrink:0;
            transition:transform 0.1s;
        }
        .cdot.active { border-color:rgba(255,255,255,0.85); transform:scale(1.25); }

        .brush-wrap { display:flex; align-items:center; }
        .brush-slider {
            width:64px; height:3px; -webkit-appearance:none;
            background:var(--btn-bd); border-radius:2px; cursor:pointer; outline:none;
        }
        .brush-slider::-webkit-slider-thumb {
            -webkit-appearance:none; width:14px; height:14px;
            background:var(--icon); border-radius:50%;
        }

        /* Sync area (A|B mode) */
        .sync-area { display:none; align-items:center; gap:3px; }
        .sync-area.visible { display:flex; }
        .sync-pt-btn {
            font-size:11px; padding:0 7px; height:38px; min-width:36px;
            line-height:1.2; text-align:center;
        }
        .sync-pt-btn.active { color:var(--sync-c) !important; border-color:var(--sync-c) !important; }
        .sync-btn { font-size:12px; padding:0 9px; color:var(--icon-dim); }
        .sync-btn.active { color:#d4e040; }

        /* Big play */
        #playBtn {
            width:48px; height:48px; background:var(--play);
            border:none; border-radius:12px; color:#001800;
            font-size:23px; cursor:pointer;
            display:flex; align-items:center; justify-content:center;
            flex-shrink:0; font-weight:900;
            box-shadow:0 0 14px var(--play-sh);
            transition:all 0.13s; margin-left:2px;
        }
        #playBtn:active { transform:scale(0.91); background:#15a012; }

        /* ══ ZOOM POPUP ══ */
        #zoomPopup {
            position:fixed; top:58px; left:50%;
            transform:translateX(-50%);
            background:var(--bar); border:1px solid var(--btn-act-bd);
            border-radius:12px; padding:10px 12px;
            display:flex; flex-direction:column; gap:8px;
            z-index:600; min-width:180px;
            box-shadow:0 6px 24px rgba(0,0,0,0.7);
        }
        #zoomPopup.hidden { display:none; }
        .zpop-label { font-size:11px; color:var(--icon-dim); text-align:center; font-family:monospace; }
        .zpop-btn {
            background:var(--btn); border:1px solid var(--btn-bd);
            color:var(--icon); padding:8px 14px; border-radius:8px;
            font-size:14px; cursor:pointer; text-align:left;
        }
        .zpop-btn:active { background:var(--btn-act); }
        .zpop-slider { width:100%; accent-color:var(--icon); height:4px; }

        /* ══ PANELS ══ */
        #panels-container {
            flex:1; display:flex; flex-direction:row;
            overflow:hidden; min-height:0;
            gap:2px; padding:2px; background:#040402;
        }
        .panel {
            flex:1; display:flex; flex-direction:column;
            min-width:0; overflow:hidden; border-radius:4px;
        }
        .vwrap {
            flex:1; position:relative;
            background:#000; overflow:hidden; min-height:0;
        }
        .zoom-wrap {
            position:absolute; top:0; left:0;
            width:100%; height:100%;
            transform-origin:center center;
            display:flex; align-items:center; justify-content:center;
            will-change:transform;
        }
        .panel-video {
            max-width:100%; max-height:100%;
            object-fit:contain; display:block;
        }
        .panel-canvas {
            position:absolute; top:0; left:0;
            width:100%; height:100%; touch-action:none;
        }

        /* Badges */
        .zoom-badge {
            position:absolute; top:6px; left:6px;
            background:rgba(0,0,0,0.6); color:var(--icon-dim);
            font-size:10px; padding:2px 7px; border-radius:4px;
            pointer-events:none; z-index:5; font-family:monospace;
        }
        .zoom-badge.zoomed { color:#d4c040; }
        .fps-badge {
            position:absolute; top:24px; left:6px;
            background:rgba(0,0,0,0.6); color:var(--icon-dim);
            font-size:10px; padding:2px 7px; border-radius:4px;
            pointer-events:none; z-index:5; font-family:monospace;
        }
        .fps-badge.hidden { display:none; }
        .fps-badge.detected { color:#80c060; }
        .panel-id-badge {
            position:absolute; top:6px; right:6px;
            background:rgba(0,0,0,0.55); color:var(--icon);
            font-size:13px; font-weight:700;
            padding:2px 9px; border-radius:4px;
            pointer-events:none; z-index:5;
        }

        /* Loading overlay */
        @keyframes spin { to { transform:rotate(360deg); } }
        .loading-overlay {
            position:absolute; inset:0; z-index:12;
            background:rgba(0,0,0,0.75);
            display:flex; flex-direction:column;
            align-items:center; justify-content:center; gap:10px;
        }
        .loading-overlay.hidden { display:none; }
        .loading-spinner {
            width:32px; height:32px;
            border:3px solid rgba(180,168,48,0.2);
            border-top-color:var(--icon);
            border-radius:50%;
            animation:spin 0.8s linear infinite;
        }
        .loading-text { font-size:11px; color:var(--icon-dim); }

        /* Drop zone */
        .drop-zone {
            position:absolute; inset:0;
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            background:rgba(0,0,0,0.88); cursor:pointer;
            z-index:10; gap:12px;
        }
        .drop-zone.hidden { display:none; }
        .dz-icon { font-size:50px; opacity:0.45; }
        .dz-text { font-size:15px; color:var(--txt); }
        .dz-btn {
            background:var(--btn-act); border:1px solid var(--btn-act-bd);
            color:#d4e040; padding:10px 28px; border-radius:9px;
            font-size:15px; cursor:pointer; font-weight:700;
        }

        /* ══ SEEK ROW ══ */
        .seek-row {
            background:var(--bar); border-top:1px solid var(--sep);
            padding:5px 6px; display:flex; align-items:center;
            gap:4px; flex-shrink:0;
        }
        .sk-btn {
            background:var(--btn); border:1px solid var(--btn-bd);
            color:var(--icon); width:30px; height:30px;
            border-radius:7px; font-size:12px; cursor:pointer;
            display:flex; align-items:center; justify-content:center;
            flex-shrink:0; transition:all 0.12s;
            touch-action:none; user-select:none; -webkit-user-select:none;
        }
        .sk-btn:active { background:var(--btn-act); transform:scale(0.88); }
        .sk-btn.play-sk {
            background:var(--play); border-color:var(--play); color:#001800;
            width:34px; height:34px; font-size:15px; border-radius:8px; font-weight:900;
        }
        .sk-btn.clear-sk {
            background:var(--red-btn); border-color:var(--red-bd); color:var(--red-ic);
        }

        /* Seek bar + sync dot */
        .seek-wrap { flex:1; position:relative; display:flex; align-items:center; }
        .seek-bar {
            width:100%; height:4px; -webkit-appearance:none;
            background:var(--btn-bd); border-radius:2px;
            cursor:pointer; outline:none;
        }
        .seek-bar::-webkit-slider-thumb {
            -webkit-appearance:none; width:13px; height:13px;
            background:var(--icon); border-radius:50%;
        }
        .sync-dot {
            position:absolute; top:50%; transform:translate(-50%,-50%);
            width:9px; height:9px; border-radius:50%;
            background:var(--sync-c); pointer-events:none;
            display:none; z-index:2; border:1px solid rgba(0,0,0,0.4);
        }

        .spd-sel {
            background:var(--btn); border:1px solid var(--btn-bd);
            color:var(--txt); padding:2px 3px;
            border-radius:6px; font-size:10px;
            cursor:pointer; outline:none; height:26px; flex-shrink:0;
        }
        .spd-sel option { background:var(--bar); }
        .time-disp {
            font-size:10px; color:var(--icon-dim);
            min-width:80px; text-align:right;
            font-family:monospace; white-space:nowrap;
        }

        /* ══ TOAST ══ */
        #toast {
            position:fixed; bottom:48px; left:50%;
            transform:translateX(-50%) translateY(16px);
            background:rgba(8,8,4,0.94); color:var(--icon);
            padding:7px 18px; border-radius:20px; font-size:13px;
            opacity:0; transition:all 0.3s; pointer-events:none;
            z-index:1000; border:1px solid var(--btn-act-bd);
            max-width:80vw; text-align:center;
        }
        #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

        input[type="file"] { display:none; }
        .hidden { display:none !important; }
        #debugPanel:not(.hidden) { display:flex !important; }

        body.tool-pen    .panel-canvas,
        body.tool-line   .panel-canvas,
        body.tool-arrow  .panel-canvas,
        body.tool-circle .panel-canvas,
        body.tool-rect   .panel-canvas { cursor:crosshair; }
        body.tool-eraser .panel-canvas { cursor:cell; }
    </style>
</head>
<body class="tool-pen">

<!-- ══════════════════════════════
     TOP TOOLBAR
══════════════════════════════ -->
<div id="toolbar">

    <button class="tb-btn" onclick="triggerLoad(activePanel)" title="動画を開く" style="font-size:19px">📂</button>
    <div class="tb-sep"></div>

    <!-- Mode -->
    <div class="mode-group">
        <button class="mode-btn active" id="modeA"  onclick="setMode('a')">A</button>
        <button class="mode-btn"        id="modeAB" onclick="setMode('ab')">A|B</button>
        <button class="mode-btn"        id="modeB"  onclick="setMode('b')">B</button>
    </div>
    <div class="tb-sep"></div>

    <!-- Zoom -->
    <button class="tb-btn" id="zoomBtn" onclick="toggleZoomPopup()" style="font-size:13px;padding:0 11px;">Zoom ▾</button>
    <div class="tb-sep"></div>

    <!-- Drawing tools -->
    <div class="tool-group">
        <button class="tb-btn tool-btn active" id="tool-pen"    onclick="setTool('pen')"    title="ペン"  >✏</button>
        <button class="tb-btn tool-btn"        id="tool-arrow"  onclick="setTool('arrow')"  title="矢印" >→</button>
        <button class="tb-btn tool-btn"        id="tool-line"   onclick="setTool('line')"   title="直線" >╱</button>
        <button class="tb-btn tool-btn"        id="tool-circle" onclick="setTool('circle')" title="楕円" >○</button>
        <button class="tb-btn tool-btn"        id="tool-rect"   onclick="setTool('rect')"   title="四角" >□</button>
        <button class="tb-btn tool-btn"        id="tool-eraser" onclick="setTool('eraser')" title="消し" >⊘</button>
    </div>
    <div class="tb-sep"></div>

    <!-- Colors -->
    <div class="color-strip">
        <button class="cdot active" style="background:#ef4444" data-c="#ef4444" onclick="setColor(this)"></button>
        <button class="cdot"        style="background:#3b82f6" data-c="#3b82f6" onclick="setColor(this)"></button>
        <button class="cdot"        style="background:#facc15" data-c="#facc15" onclick="setColor(this)"></button>
        <button class="cdot"        style="background:#22c55e" data-c="#22c55e" onclick="setColor(this)"></button>
        <button class="cdot"        style="background:#ffffff" data-c="#ffffff" onclick="setColor(this)"></button>
        <button class="cdot"        style="background:#f97316" data-c="#f97316" onclick="setColor(this)"></button>
    </div>
    <div class="tb-sep"></div>

    <!-- Undo / Clear -->
    <button class="tb-btn" onclick="undoDraw()"                   title="元に戻す"  style="font-size:16px">↩</button>
    <button class="tb-btn" onclick="clearPanelDraw(activePanel)"  title="描画クリア"
            style="color:var(--red-ic);background:var(--red-btn);border-color:var(--red-bd);font-size:16px">🗑</button>
    <div class="tb-sep"></div>

    <!-- Brush size -->
    <div class="brush-wrap" title="線の太さ">
        <input type="range" class="brush-slider" id="brushSlider" min="1" max="20" value="3"
               oninput="brushSize=+this.value">
    </div>
    <div class="tb-sep"></div>

    <!-- Sync area (visible in A|B mode) -->
    <div class="sync-area" id="syncArea">
        <button class="tb-btn sync-pt-btn" id="spBtn1" onclick="setSyncPoint(1)" title="A: 同期基準点を設定">📌 A</button>
        <button class="tb-btn sync-pt-btn" id="spBtn2" onclick="setSyncPoint(2)" title="B: 同期基準点を設定">📌 B</button>
        <button class="tb-btn sync-pt-btn" onclick="resetSyncPoints()" title="基準点をリセット" style="font-size:14px">↺</button>
        <button class="tb-btn sync-btn" id="syncBtn" onclick="toggleSync()" title="同期再生">🔗 同期</button>
    </div>

    <div style="flex:1"></div>
    <span id="vLabel" style="font-size:9px;color:var(--icon-dim);opacity:0.5;flex-shrink:0;white-space:nowrap;padding-right:4px;cursor:pointer" title="長押しでデバッグ情報">v2.2</span>
    <button id="playBtn" onclick="togglePlay()">▶</button>
</div>

<!-- Update notification banner (hidden until SW update detected) -->
<div id="updateBanner" class="hidden" style="
    background:#0d2510; color:#7ec87e; padding:5px 12px;
    font-size:11px; display:flex; align-items:center; gap:8px;
    border-bottom:1px solid #1a4020; flex-shrink:0;
">
    <span>🔄 新しいバージョンが利用可能です</span>
    <button onclick="applySWUpdate()" style="
        background:#1a3a1a; border:1px solid #2a5a2a; color:#90d890;
        padding:2px 10px; border-radius:5px; font-size:10px; cursor:pointer;
    ">再読み込み</button>
    <button onclick="document.getElementById('updateBanner').classList.add('hidden')" style="
        background:none; border:none; color:#4a8a4a; cursor:pointer; margin-left:auto; font-size:14px;
    ">×</button>
</div>

<!-- Debug panel (hidden by default, toggle via long-press on version label) -->
<div id="debugPanel" class="hidden" style="
    background:#0a100a; color:#70a070; font-size:10px; font-family:monospace;
    padding:6px 10px; border-bottom:1px solid #1a2a1a; flex-shrink:0;
    display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start;
">
    <div id="dbg1" style="min-width:160px">A: —</div>
    <div id="dbg2" style="min-width:160px">B: —</div>
    <button onclick="copyDebugInfo()" style="
        background:#0d200d; border:1px solid #2a4a2a; color:#80c080;
        padding:2px 8px; border-radius:4px; font-size:9px; cursor:pointer;
        height:20px; white-space:nowrap;
    ">📋 コピー</button>
</div>

<!-- ══════════════════════════════
     ZOOM POPUP
══════════════════════════════ -->
<div id="zoomPopup" class="hidden">
    <span class="zpop-label" id="zoomLabel">ズーム: 100%</span>
    <input type="range" class="zpop-slider" id="zoomSlider" min="50" max="600" value="100" step="10"
           oninput="setZoomValue(activePanel,+this.value)">
    <button class="zpop-btn" onclick="adjustZoom(activePanel, 0.5)">🔍 拡大 (+50%)</button>
    <button class="zpop-btn" onclick="adjustZoom(activePanel,-0.5)">🔎 縮小 (-50%)</button>
    <button class="zpop-btn" onclick="resetZoom(activePanel)">⊡ リセット (100%)</button>
</div>

<!-- ══════════════════════════════
     PANELS
══════════════════════════════ -->
<div id="panels-container">

    <!-- Panel A -->
    <div class="panel" id="panel1">
        <div class="vwrap" id="wrapper1">
            <div class="zoom-wrap" id="zoom1">
                <video class="panel-video" id="video1" playsinline preload="metadata"></video>
                <canvas class="panel-canvas" id="canvas1"></canvas>
            </div>
            <div class="zoom-badge" id="zind1">100%</div>
            <div class="fps-badge hidden" id="fps1">30fps</div>
            <div class="panel-id-badge">A</div>
            <div class="loading-overlay hidden" id="loading1">
                <div class="loading-spinner"></div>
                <span class="loading-text">読み込み中...</span>
            </div>
            <div class="drop-zone" id="dz1" onclick="triggerLoad(1)">
                <div class="dz-icon">🎬</div>
                <div class="dz-text">タップして動画 A を選択</div>
                <button class="dz-btn">ファイルを開く</button>
            </div>
        </div>
        <div class="seek-row">
            <button class="sk-btn" id="sk1p5" title="-5f">⏮</button>
            <button class="sk-btn" id="sk1p1" title="-1f">◀</button>
            <button class="sk-btn play-sk" id="pplay1" onclick="togglePanelPlay(1)">▶</button>
            <div class="seek-wrap">
                <input type="range" class="seek-bar" id="seek1" min="0" max="1000" value="0" step="1">
                <div class="sync-dot" id="sdot1"></div>
            </div>
            <button class="sk-btn" id="sk1n1" title="+1f">▶</button>
            <button class="sk-btn" id="sk1n5" title="+5f">⏭</button>
            <select class="spd-sel" onchange="setPanelSpeed(1,this.value)">
                <option value="0.1">0.1x</option><option value="0.25">0.25x</option>
                <option value="0.5">0.5x</option><option value="0.75">0.75x</option>
                <option value="1" selected>1x</option>
                <option value="1.5">1.5x</option><option value="2">2x</option>
            </select>
            <span class="time-disp" id="time1">0:00 / 0:00</span>
            <button class="sk-btn clear-sk" onclick="clearPanelDraw(1)" title="描画クリア">🗑</button>
        </div>
    </div>

    <!-- Panel B -->
    <div class="panel" id="panel2" style="display:none">
        <div class="vwrap" id="wrapper2">
            <div class="zoom-wrap" id="zoom2">
                <video class="panel-video" id="video2" playsinline preload="metadata"></video>
                <canvas class="panel-canvas" id="canvas2"></canvas>
            </div>
            <div class="zoom-badge" id="zind2">100%</div>
            <div class="fps-badge hidden" id="fps2">30fps</div>
            <div class="panel-id-badge">B</div>
            <div class="loading-overlay hidden" id="loading2">
                <div class="loading-spinner"></div>
                <span class="loading-text">読み込み中...</span>
            </div>
            <div class="drop-zone" id="dz2" onclick="triggerLoad(2)">
                <div class="dz-icon">🎬</div>
                <div class="dz-text">タップして動画 B を選択</div>
                <button class="dz-btn">ファイルを開く</button>
            </div>
        </div>
        <div class="seek-row">
            <button class="sk-btn" id="sk2p5" title="-5f">⏮</button>
            <button class="sk-btn" id="sk2p1" title="-1f">◀</button>

<script>
// ════════════════════════════════════════
// STATE
// ════════════════════════════════════════
const APP_VERSION = '2.2';

let mode        = 'a';
let tool        = 'pen';
let color       = '#ef4444';
let brushSize   = 3;
let syncMode    = false;
let activePanel = 1;
let drawing     = false;
let seekingPanel = 0;
let zoomPopupOpen = false;
let debugVisible  = false;

// Per-panel rVFC estimation state
// IMPORTANT: rVFC/presentedFrames gives an ESTIMATE of fps, NOT an authoritative value.
// presentedFrames counts compositor submissions, not unique decoded frames.
// On a 60Hz display, 120fps video may present frames 2-at-a-time, so the
// callback fires at 60Hz. The estimate can be incorrect and should NOT be used
// as the sole source of frame timing. Container analysis (mp4Analysis) is authoritative.
const panelState = {
    1: { fps: 30, fpsDetected: false, detecting: false, isVFR: false },
    2: { fps: 30, fpsDetected: false, detecting: false, isVFR: false }
};

// Container analysis result (authoritative frame timing source)
// Obtained by parsing the MP4/MOV moov box directly (File.slice, no full load)
const mp4Analysis = {
    1: { status: 'none', pts: null, codec: '?', fps: null, isVFR: false,
         frameCount: 0, parseMs: 0, error: '' },
    2: { status: 'none', pts: null, codec: '?', fps: null, isVFR: false,
         frameCount: 0, parseMs: 0, error: '' }
};

// Load timing for debug panel
const loadTiming = {
    1: { fileSelectMs: 0, metadataMs: 0, firstFrameMs: 0, canPlayMs: 0, fileBytes: 0 },
    2: { fileSelectMs: 0, metadataMs: 0, firstFrameMs: 0, canPlayMs: 0, fileBytes: 0 }
};

// Frame step timing (last 20 step durations in ms)
const stepTiming = { 1: [], 2: [] };

// rVFC frame cache: timestamps of frames OBSERVED during playback.
// LIMITATION: at 120fps on 60Hz, only ~half of frames are captured.
// This cache is used ONLY for rVFC-based fps estimation, NOT for frame stepping.
const frameCache = {
    1: { times: [] },
    2: { times: [] }
};

// Pending steps for SINGLE-TAP only (max 1 step buffered per panel).
// Long-press NEVER accumulates here — it skips ticks while seeking.

// SW update reference (waiting SW worker)

// Vector-based drawing: objects stored in normalized video-space coords

    2: { objects: [], current: null }
};

// Zoom state

    2: { scale:1, panX:0, panY:0, pinching:false, lastDist:0, lastMidX:0, lastMidY:0, justPinched:false }
};

// RAF render throttle

// Long-press state (global — only one touch active at a time)

let lpRepeatTimer = null;
let lpActive     = false;

// ════════════════════════════════════════
// INIT
// ════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
    [1, 2].forEach(p => { initCanvas(p); initVideoEvents(p); });

    });

    // Service Worker registration + proper update flow

            navigator.serviceWorker.register('./sw.js', { scope: './' })
                .then(reg => {

                    const showUpdateBanner = (waiting) => {
                        pendingSW = waiting;

                    };

                    // Already a waiting SW (e.g. page reloaded while update pending)
                    if (reg.waiting) showUpdateBanner(reg.waiting);

                    // New SW found during this session
                    reg.addEventListener('updatefound', () => {
                        const nw = reg.installing;
                        nw.addEventListener('statechange', () => {
                            if (nw.state === 'installed' && navigator.serviceWorker.controller) {

                            }
                        });
                    });
                })
                .catch(e => console.warn('[SW] register failed:', e));

            // controllerchange fires AFTER skipWaiting succeeds → reload once
            let swReloading = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (swReloading) return;
                swReloading = true;

        });

        vl.addEventListener('pointercancel', () => { if(vlTimer){clearTimeout(vlTimer);vlTimer=null;} });
    }
});

// ════════════════════════════════════════
// LONG PRESS
// ════════════════════════════════════════
//
// Two-mode design:
//   INITIAL TAP:  One step, accumulates one pendingStep if seeking
//   LP REPEAT:    Each tick fires ONLY if !vid.seeking; never accumulates
//
// stopLP() clears all pendingSteps to discard any queued operations
// that originated from this long-press session.

function stopLP() {
    lpActive = false;
    if (lpHoldTimer)   { clearTimeout(lpHoldTimer);   lpHoldTimer   = null; }
    if (lpRepeatTimer) { clearInterval(lpRepeatTimer); lpRepeatTimer = null; }
    // Discard any queued steps from this long-press session
    pendingSteps[1] = 0;
    pendingSteps[2] = 0;
}

function setupLP(el, tapFn, lpFn) {
    if (!el) return;

    el.addEventListener('pointerdown', e => {
        e.preventDefault();
        try { el.setPointerCapture(e.pointerId); } catch(_) {}
        stopLP();
        lpActive = true;
        tapFn();  // immediate tap on first press (may queue pendingStep if seeking)
        lpHoldTimer = setTimeout(() => {
            lpHoldTimer = null;
            if (!lpActive) return;
            lpRepeatTimer = setInterval(() => {
                if (!lpActive) { stopLP(); return; }
                lpFn(); // LP repeat — skips if seeking (see stepPanelFrame)
            }, 80);
        }, 300);
    });

    el.addEventListener('pointermove', e => {
        if (!lpActive) return;
        const r = el.getBoundingClientRect();
        const pad = 15;
        if (e.clientX < r.left - pad || e.clientX > r.right  + pad ||
            e.clientY < r.top  - pad || e.clientY > r.bottom + pad) {
            stopLP();
        }
    });

    el.addEventListener('pointerup',          stopLP);
    el.addEventListener('pointercancel',      stopLP);
    el.addEventListener('lostpointercapture', stopLP);
    el.addEventListener('contextmenu',        e => e.preventDefault());
}

function initLongPress() {
    // tapFn: single-tap behavior (queues one pendingStep if seeking)
    // lpFn:  long-press repeat (skips the tick if seeking, never queues)
    setupLP(document.getElementById('sk1p5'),
        () => stepPanelFrame(1, -5, false),
        () => stepPanelFrame(1, -5, true));
    setupLP(document.getElementById('sk1p1'),
        () => stepPanelFrame(1, -1, false),
        () => stepPanelFrame(1, -1, true));
    setupLP(document.getElementById('sk1n1'),
        () => stepPanelFrame(1,  1, false),
        () => stepPanelFrame(1,  1, true));
    setupLP(document.getElementById('sk1n5'),
        () => stepPanelFrame(1,  5, false),
        () => stepPanelFrame(1,  5, true));
    setupLP(document.getElementById('sk2p5'),
        () => stepPanelFrame(2, -5, false),
        () => stepPanelFrame(2, -5, true));
    setupLP(document.getElementById('sk2p1'),
        () => stepPanelFrame(2, -1, false),
        () => stepPanelFrame(2, -1, true));
    setupLP(document.getElementById('sk2n1'),
        () => stepPanelFrame(2,  1, false),
        () => stepPanelFrame(2,  1, true));
    setupLP(document.getElementById('sk2n5'),
        () => stepPanelFrame(2,  5, false),
        () => stepPanelFrame(2,  5, true));
}

// ════════════════════════════════════════
// MODE
// ════════════════════════════════════════
function setMode(m) {

    mode = m;

    if (m !== 'ab' && syncMode) {

        document.getElementById('syncBtn').classList.remove('active');
    }

    document.getElementById('modeAB').classList.toggle('active', m === 'ab');

    if (p1.style.display === 'flex') p1.style.flexDirection = 'column';

    if (p2.style.display === 'flex') p2.style.flexDirection = 'column';

}

// ════════════════════════════════════════
// VIDEO LOADING
// ════════════════════════════════════════
function triggerLoad(p) { document.getElementById('fi'+p).click(); }

function loadVideo(p, input) {
    const file = input.files[0];
    if (!file) return;
    const vid = document.getElementById('video'+p);

    // Stop long-press and discard pending steps for the old video
    stopLP();

    // Show loading indicator
    document.getElementById('loading'+p).classList.remove('hidden');

    // Free previous blob URL
    if (vid._blobUrl) { URL.revokeObjectURL(vid._blobUrl); vid._blobUrl = null; }

    // Reset all per-panel state
    panelState[p] = { fps: 30, fpsDetected: false, detecting: false, isVFR: false };
    mp4Analysis[p] = { status: 'none', pts: null, codec: '?', fps: null,
                       isVFR: false, frameCount: 0, parseMs: 0, error: '' };
    frameCache[p].times = [];
    pendingSteps[p] = 0;

    // Record timing start
    const t0 = performance.now();
    loadTiming[p] = { fileSelectMs: t0, metadataMs: 0, firstFrameMs: 0,
                      canPlayMs: 0, fileBytes: file.size };

    updateFPSBadge(p); // show "…fps" (analyzing)

    const url = URL.createObjectURL(file);
    vid._blobUrl = url;
    vid.src = url;
    document.getElementById('dz'+p).classList.add('hidden');

    // Start container analysis in PARALLEL with video loading
    // Uses File.slice to read only the moov box (no full file load)
    analyzeVideoFile(p, file);

    // Timing: loadedmetadata
    vid.addEventListener('loadedmetadata', () => {
        loadTiming[p].metadataMs = performance.now() - t0;
        resizeCanvas(p);
        updateTime(p);
        if (vid.currentTime === 0) vid.currentTime = 0.001;
    }, { once: true });

    // Timing: first frame decoded (loadeddata)
    const hideLoad = () => { document.getElementById('loading'+p).classList.add('hidden'); };
    vid.addEventListener('loadeddata', () => {
        loadTiming[p].firstFrameMs = performance.now() - t0;
        hideLoad();
        updateDebugPanel(p);
    }, { once: true });

    // Timing: canplay
    vid.addEventListener('canplay', () => {
        loadTiming[p].canPlayMs = performance.now() - t0;
        updateDebugPanel(p);
    }, { once: true });

    // Fallback hide after 5s
    const fbTimer = setTimeout(hideLoad, 5000);
    vid.addEventListener('loadeddata', () => clearTimeout(fbTimer), { once: true });
    vid.addEventListener('error', () => {
        clearTimeout(fbTimer); hideLoad();
        mp4Analysis[p].status = 'error'; mp4Analysis[p].error = 'Video load error';
        showToast('読み込みエラー');
    }, { once: true });

    input.value = '';
    showToast(`動画 ${p===1?'A':'B'} を読み込んでいます...`);
}

// ════════════════════════════════════════
// FPS DETECTION  (requestVideoFrameCallback)
// ════════════════════════════════════════
const KNOWN_FPS = [24, 25, 29.97, 30, 50, 59.94, 60, 120, 240];

function snapFPS(fps) {
    return KNOWN_FPS.reduce((a, b) => Math.abs(b - fps) < Math.abs(a - fps) ? b : a);
}

function startFPSDetection(p) {
    const vid = document.getElementById('video'+p);

    if (!('requestVideoFrameCallback' in HTMLVideoElement.prototype)) {
        panelState[p].fpsDetected = false;
        panelState[p].detecting   = false;
        updateFPSBadge(p);
        return;
    }

    // ── rVFC-based FPS ESTIMATION (auxiliary only) ──
    //
    // IMPORTANT LIMITATION: presentedFrames counts frames submitted to the
    // display compositor, NOT unique decoded video frames. The browser may:
    //   - Drop frames under load
    //   - Present the same frame multiple times (stuttering)
    //   - Report non-integer pfDelta values in some implementations
    //
    // On a 60Hz display with 120fps video, the callback fires at 60Hz.
    // presentedFrames typically increments by 2 per callback, suggesting
    // pfDelta/timeDelta ≈ 120fps. HOWEVER, the browser is not guaranteed
    // to present every frame — if frames are decoded ahead and batched,
    // pfDelta could vary. This estimate is useful but NOT authoritative.
    //
    // Authoritative FPS comes from the container parser (analyzeVideoFile).
    // rVFC result is used ONLY as fallback when container parsing fails.

    const measurements = []; // each = presentedFramesDelta / mediaTimeDelta (= native fps)
    let lastPF = null;  // previous presentedFrames value
    let lastMT = null;  // previous mediaTime in seconds

    function onFrame(_, meta) {
        // Always cache the actual frame timestamp for precise stepping
        cacheFrameTime(p, meta.mediaTime);

        if (lastPF !== null) {
            const pfDelta   = meta.presentedFrames - lastPF;
            const timeDelta = meta.mediaTime - lastMT;

            // pfDelta = number of VIDEO frames presented since last callback
            // timeDelta = elapsed video time since last callback
            // pfDelta / timeDelta = native video fps
            if (pfDelta > 0 && timeDelta > 0.001 && timeDelta < 0.5) {
                measurements.push(pfDelta / timeDelta);
            }
        }

        lastPF = meta.presentedFrames;
        lastMT = meta.mediaTime;

        if (measurements.length < 12) {
            vid.requestVideoFrameCallback(onFrame);
        } else {
            panelState[p].detecting = false;
            finalizeDetection(p, measurements);
            // Switch to continuous cache-building mode after detection
            _continueCaching(p);
        }
    }

    vid.requestVideoFrameCallback(onFrame);
}

// Continuously cache frame timestamps during playback.
// Called once detection is done; self-terminates when video pauses.
// On next play(), the play-event handler restarts it.
function _continueCaching(p) {
    if (!('requestVideoFrameCallback' in HTMLVideoElement.prototype)) return;
    const vid = document.getElementById('video'+p);
    if (vid.paused || vid.ended) return;
    function cacheFrame(_, meta) {
        cacheFrameTime(p, meta.mediaTime);
        // Keep going as long as the video is playing
        if (!vid.paused && !vid.ended) vid.requestVideoFrameCallback(cacheFrame);
    }
    vid.requestVideoFrameCallback(cacheFrame);
}

function finalizeDetection(p, measurements) {
    // Use median to filter outliers (e.g. frame drops at start)
    const sorted = [...measurements].sort((a, b) => a - b);
    const median = sorted[Math.floor(sorted.length / 2)];

    // Check for VFR: if spread is >25% of median, it's likely variable frame rate
    const lo = sorted[Math.floor(sorted.length * 0.1)];
    const hi = sorted[Math.floor(sorted.length * 0.9)];
    const isVFR = (hi - lo) > median * 0.25;

    if (isVFR) {
        panelState[p].isVFR       = true;
        panelState[p].fpsDetected = false;
    } else {
        panelState[p].fps         = snapFPS(median);
        panelState[p].fpsDetected = true;
        panelState[p].isVFR       = false;
    }
    updateFPSBadge(p); // re-render badge considering container analysis priority
    updateDebugPanel(p);
}

// ════════════════════════════════════════
// MP4/MOV CONTAINER PARSER
// ════════════════════════════════════════
//
// Design decisions (see v2.2 report for comparison of alternatives):
//   - Custom minimal parser (no external library) → offline-ready, ~300 lines
//   - File.slice approach: reads only the moov box (typically <1MB)
//     avoiding loading the full video into memory
//   - Authoritative source for frame PTS (not rVFC which is display-refresh-limited)
//   - Handles H.264 and HEVC (parser reads timestamps only, not codec data)
//   - Handles B-frames via ctts (composition time offset) table
//   - Handles edit lists (elst) for timestamp correction
//   - Runs in parallel with video element loading
//   - Fallback: fps-based estimation if moov cannot be found/parsed

function readSlice(file, start, end) {
    return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = e => resolve(e.target.result);
        r.onerror = reject;
        r.readAsArrayBuffer(file.slice(start, end));
    });
}

// Read a 4-byte FourCC string from a DataView
function _fcc(dv, pos) {
    let s = '';
    for (let i = 0; i < 4; i++) s += String.fromCharCode(dv.getUint8(pos + i));
    return s;
}

// Find child boxes of a given type within [start, end] of a DataView.
// Returns array of [dataStart, dataEnd] pairs.
function _findBoxes(dv, start, end, type) {
    const results = [];
    let pos = start;
    while (pos + 8 <= end) {
        const sz = dv.getUint32(pos, false);
        if (sz < 8) { pos++; continue; }
        const t = _fcc(dv, pos + 4);
        const boxEnd = Math.min(pos + sz, end);
        if (t === type) results.push([pos + 8, boxEnd]);
        pos += sz;
    }
    return results;
}
function _findBox(dv, start, end, type) {
    const r = _findBoxes(dv, start, end, type);
    return r.length ? r[0] : null;
}

function _parseTrak(dv, start, end) {
    const mdiaR = _findBox(dv, start, end, 'mdia');
    if (!mdiaR) return null;
    const [mdiaS, mdiaE] = mdiaR;

    // Must be video track (hdlr.handler_type === 'vide')
    const hdlrR = _findBox(dv, mdiaS, mdiaE, 'hdlr');
    if (!hdlrR) return null;
    if (_fcc(dv, hdlrR[0] + 8) !== 'vide') return null;

    // Track timescale from mdhd
    const mdhdR = _findBox(dv, mdiaS, mdiaE, 'mdhd');
    if (!mdhdR) return null;
    const mdhdVer = dv.getUint8(mdhdR[0]);
    const timescale = mdhdVer === 1
        ? dv.getUint32(mdhdR[0] + 20, false)
        : dv.getUint32(mdhdR[0] + 12, false);
    if (!timescale) return null;

    // Codec from stsd (first sample entry)
    let codec = '?';
    const minfR = _findBox(dv, mdiaS, mdiaE, 'minf');
    if (minfR) {
        const stblR = _findBox(dv, minfR[0], minfR[1], 'stbl');
        if (stblR) {
            const stsdR = _findBox(dv, stblR[0], stblR[1], 'stsd');
            if (stsdR && stsdR[1] - stsdR[0] >= 12) {
                // stsd: version(1)+flags(3)+entry_count(4), then first entry box
                codec = _fcc(dv, stsdR[0] + 8);
            }

            // Build PTS array from stts + ctts
            const pts = _buildPTS(dv, stblR[0], stblR[1], timescale);
            if (!pts || pts.length === 0) return null;

            return { pts, timescale, codec };
        }
    }
    return null;
}

function _buildPTS(dv, stblS, stblE, timescale) {
    // stts: sample-to-time (DTS durations)
    const sttsR = _findBox(dv, stblS, stblE, 'stts');
    if (!sttsR) return null;
    const [sttsS, sttsE] = sttsR;

    const entryCount = dv.getUint32(sttsS + 4, false);
    const dts = [];
    let pos = sttsS + 8, cur = 0;
    for (let i = 0; i < entryCount && pos + 8 <= sttsE; i++) {
        const sc = dv.getUint32(pos,     false);
        const sd = dv.getUint32(pos + 4, false);
        for (let j = 0; j < sc; j++) { dts.push(cur); cur += sd; }
        pos += 8;
    }
    if (dts.length === 0) return null;

    // ctts: composition time offset (B-frame PTS adjustments)
    const cts = new Int32Array(dts.length); // default 0
    const cttsR = _findBox(dv, stblS, stblE, 'ctts');
    if (cttsR) {
        const [cttsS, cttsE] = cttsR;
        const cttsVer = dv.getUint8(cttsS);
        const cc = dv.getUint32(cttsS + 4, false);
        let cp = cttsS + 8, ci = 0;
        for (let i = 0; i < cc && cp + 8 <= cttsE && ci < dts.length; i++) {
            const sc  = dv.getUint32(cp, false);
            const off = cttsVer === 1 ? dv.getInt32(cp + 4, false) : dv.getUint32(cp + 4, false);
            for (let j = 0; j < sc && ci < dts.length; j++, ci++) cts[ci] = off;
            cp += 8;
        }
    }

    // PTS (seconds) = (DTS + CTS) / timescale, then sort ascending
    const pts = dts.map((d, i) => (d + cts[i]) / timescale);
    pts.sort((a, b) => a - b);

    // Remove near-duplicates (<0.1ms apart)
    const uniq = [pts[0]];
    for (let i = 1; i < pts.length; i++) {
        if (pts[i] - pts[i-1] > 0.0001) uniq.push(pts[i]);
    }
    return uniq;
}

function _parseMoov(dv, start, end) {
    // Try each trak; return first valid video track
    for (const [ts, te] of _findBoxes(dv, start, end, 'trak')) {
        const result = _parseTrak(dv, ts, te);
        if (result) {
            // Apply edit list if present (elst)
            const edtsR = _findBox(dv, ts, te, 'edts');
            if (edtsR) result.pts = _applyElst(dv, edtsR[0], edtsR[1], result.pts, result.timescale);
            return result;
        }
    }
    return null;
}

function _applyElst(dv, edtsS, edtsE, pts, timescale) {
    const elstR = _findBox(dv, edtsS, edtsE, 'elst');
    if (!elstR) return pts;
    const [es] = elstR;
    const ver  = dv.getUint8(es);
    const ec   = dv.getUint32(es + 4, false);
    if (ec !== 1) return pts; // complex edit lists: skip

    // media_time: how far into the track the edit starts
    // version 0: segment_duration(4)+media_time(4), version 1: each is 8 bytes
    let mediaTime;
    if (ver === 1) {
        // read low 32 bits (track durations are unlikely to exceed 2^32/timescale)
        mediaTime = dv.getUint32(es + 16, false); // hi word ignored
    } else {
        mediaTime = dv.getUint32(es + 12, false);
    }
    const offset = mediaTime / timescale;
    if (offset < 0.001) return pts;
    return pts.map(t => Math.max(0, t - offset));
}

function _tryFindMoov(buf) {
    const dv = new DataView(buf);
    const size = dv.byteLength;
    let pos = 0;
    while (pos + 8 <= size) {
        const sz = dv.getUint32(pos, false);
        if (sz < 8 || sz > size - pos + 1024) { pos += 4; continue; }
        const t = _fcc(dv, pos + 4);
        if (t === 'moov') return _parseMoov(dv, pos + 8, pos + Math.min(sz, size));
        pos += sz;
    }
    return null;
}

async function analyzeVideoFile(p, file) {
    const a = mp4Analysis[p];
    a.status = 'analyzing';
    updateFPSBadge(p);
    updateDebugPanel(p);

    const t0 = performance.now();
    try {
        // 1. Try start of file (faststart/web-optimized MP4)
        const headSize = Math.min(file.size, 2 * 1024 * 1024);
        const headBuf  = await readSlice(file, 0, headSize);
        let result = _tryFindMoov(headBuf);

        // 2. If not found, try tail (iOS files, non-faststart)
        if (!result && file.size > 2 * 1024 * 1024) {
            const tailStart = Math.max(0, file.size - 2 * 1024 * 1024);
            const tailBuf   = await readSlice(file, tailStart, file.size);
            result = _tryFindMoov(tailBuf);
        }

        a.parseMs = performance.now() - t0;

        if (result) {
            a.status     = 'done';
            a.pts        = result.pts;
            a.codec      = result.codec;
            a.frameCount = result.pts.length;

            // Derive fps and VFR from PTS intervals
            if (result.pts.length > 4) {
                const diffs = [];
                for (let i = 1; i < Math.min(result.pts.length, 60); i++)
                    diffs.push(result.pts[i] - result.pts[i-1]);
                diffs.sort((a, b) => a - b);
                const lo  = diffs[Math.floor(diffs.length * 0.1)];
                const hi  = diffs[Math.floor(diffs.length * 0.9)];
                const med = diffs[Math.floor(diffs.length / 2)];
                a.isVFR   = (hi - lo) > med * 0.15;
                a.fps     = a.isVFR ? null : snapFPS(1 / med);
            }
        } else {
            a.status = 'unsupported';
            a.error  = 'moov box not found (non-MP4/MOV, encrypted, or partial file)';
        }
    } catch (e) {
        a.status = 'error';
        a.error  = String(e);
        a.parseMs = performance.now() - t0;
    }

    updateFPSBadge(p);
    updateDebugPanel(p);
}

// Update the FPS badge based on container analysis result + rVFC estimate
function updateFPSBadge(p) {
    const badge = document.getElementById('fps'+p);
    const a  = mp4Analysis[p];
    const ps = panelState[p];

    badge.classList.remove('hidden');

    if (a.status === 'done') {
        if (a.isVFR) {
            badge.textContent = 'VFR';
            badge.className   = 'fps-badge';
        } else if (a.fps) {
            badge.textContent = a.fps + 'fps';
            badge.className   = 'fps-badge detected'; // green = container-verified
        } else {
            badge.textContent = '?fps';
            badge.className   = 'fps-badge';
        }
    } else if (a.status === 'analyzing') {
        badge.textContent = '…fps';
        badge.className   = 'fps-badge';
    } else {
        // Container parse failed/unsupported — show rVFC estimate with "~" prefix
        // "~" explicitly indicates this is an ESTIMATE, not a confirmed value
        if (ps.fpsDetected) {
            badge.textContent = '~' + ps.fps + 'fps';
        } else {
            badge.textContent = '~fps';
        }
        badge.className = 'fps-badge'; // no 'detected' class
    }
}

// ════════════════════════════════════════
// CANVAS
// ════════════════════════════════════════
function initCanvas(p) {
    resizeCanvas(p);
    setupDraw(p);
}

function resizeCanvas(p) {
    const wrapper = document.getElementById('wrapper'+p);
    const canvas  = document.getElementById('canvas'+p);
    const W = wrapper.offsetWidth, H = wrapper.offsetHeight;
    if (!W || !H) return;
    canvas.width  = W;
    canvas.height = H;
    renderDrawings(p); // Re-render from stored vector data
}

// Returns the video's display rect in canvas-pixel coordinates
// (accounting for letterbox/pillarbox from object-fit:contain)
function getVideoRect(p) {
    const vid    = document.getElementById('video'+p);
    const canvas = document.getElementById('canvas'+p);
    const W = canvas.width, H = canvas.height;
    if (!W || !H) return { x:0, y:0, w:W||1, h:H||1 };
    const vW = vid.videoWidth, vH = vid.videoHeight;
    if (!vW || !vH) return { x:0, y:0, w:W, h:H };
    const vAR = vW / vH, cAR = W / H;
    let w, h;
    if (vAR > cAR) { w = W; h = W / vAR; }
    else           { h = H; w = H * vAR; }
    return { x:(W-w)/2, y:(H-h)/2, w, h };
}

// Convert canvas-pixel coords → normalized video coords
function toNorm(p, cx, cy) {
    const r = getVideoRect(p);
    return { x:(cx - r.x) / r.w, y:(cy - r.y) / r.h };
}

// ════════════════════════════════════════
// DRAWING — VECTOR-BASED
// Objects are stored in normalized video coords (0…1).
// On resize/zoom/orientation: renderDrawings() redraws from scratch.
// ════════════════════════════════════════
function scheduleRender(p) {
    if (renderPending[p]) return;
    renderPending[p] = true;
    requestAnimationFrame(() => { renderPending[p] = false; renderDrawings(p); });
}

function renderDrawings(p) {
    const canvas = document.getElementById('canvas'+p);
    const ctx    = canvas.getContext('2d');
    const r      = getVideoRect(p);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const obj of ds[p].objects) _drawObj(ctx, obj, r);
    if (ds[p].current) _drawObj(ctx, ds[p].current, r);
}

function _drawObj(ctx, obj, r) {
    // Helper: normalized → canvas pixels
    const c = (nx, ny) => ({ x: r.x + nx * r.w, y: r.y + ny * r.h });

    ctx.save();
    ctx.strokeStyle = obj.color;
    ctx.fillStyle   = obj.color;
    ctx.lineWidth   = obj.size;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';

    if (obj.type === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = obj.size * 5;
        const pts = obj.pts;
        if (pts && pts.length > 1) {
            ctx.beginPath();
            const p0 = c(pts[0].x, pts[0].y);
            ctx.moveTo(p0.x, p0.y);
            for (let i = 1; i < pts.length; i++) { const pi = c(pts[i].x, pts[i].y); ctx.lineTo(pi.x, pi.y); }
            ctx.stroke();
        }

    } else if (obj.type === 'pen') {
        const pts = obj.pts;
        if (!pts || pts.length === 0) { ctx.restore(); return; }
        if (pts.length === 1) {
            const p0 = c(pts[0].x, pts[0].y);
            ctx.beginPath(); ctx.arc(p0.x, p0.y, obj.size / 2, 0, Math.PI*2); ctx.fill();
        } else {
            ctx.beginPath();
            const p0 = c(pts[0].x, pts[0].y);
            ctx.moveTo(p0.x, p0.y);
            for (let i = 1; i < pts.length; i++) { const pi = c(pts[i].x, pts[i].y); ctx.lineTo(pi.x, pi.y); }
            ctx.stroke();
        }

    } else if (obj.type === 'line') {
        const p1 = c(obj.x1, obj.y1), p2 = c(obj.x2, obj.y2);
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();

    } else if (obj.type === 'arrow') {
        const p1 = c(obj.x1, obj.y1), p2 = c(obj.x2, obj.y2);
        const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
        const h = Math.max(12, obj.size * 5);
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(p2.x, p2.y);
        ctx.lineTo(p2.x - h*Math.cos(angle - Math.PI/6), p2.y - h*Math.sin(angle - Math.PI/6));
        ctx.lineTo(p2.x - h*Math.cos(angle + Math.PI/6), p2.y - h*Math.sin(angle + Math.PI/6));
        ctx.closePath(); ctx.fill();

    } else if (obj.type === 'circle') {
        const p1 = c(obj.x1, obj.y1), p2 = c(obj.x2, obj.y2);
        const rx = Math.abs(p2.x - p1.x) / 2, ry = Math.abs(p2.y - p1.y) / 2;
        if (rx < 1 && ry < 1) { ctx.restore(); return; }
        ctx.beginPath();
        ctx.ellipse((p1.x+p2.x)/2, (p1.y+p2.y)/2, Math.max(rx,0.5), Math.max(ry,0.5), 0, 0, Math.PI*2);
        ctx.stroke();

    } else if (obj.type === 'rect') {
        const p1 = c(obj.x1, obj.y1), p2 = c(obj.x2, obj.y2);
        ctx.strokeRect(p1.x, p1.y, p2.x - p1.x, p2.y - p1.y);
    }

    ctx.restore();
}

// ════════════════════════════════════════
// DRAWING — INPUT (touch / mouse)
// ════════════════════════════════════════
function setupDraw(p) {
    const canvas = document.getElementById('canvas'+p);

    canvas.addEventListener('mousedown',  e => { e.preventDefault(); activePanel=p; _startDraw(p,e); });
    canvas.addEventListener('mousemove',  e => { e.preventDefault(); _moveDraw(p,e); });
    canvas.addEventListener('mouseup',    e => { e.preventDefault(); _endDraw(p,e); });
    canvas.addEventListener('mouseleave', e => { if (drawing && activePanel===p) _endDraw(p,e); });
    canvas.addEventListener('wheel', e => {
        e.preventDefault(); activePanel=p;
        adjustZoom(p, e.deltaY < 0 ? 0.2 : -0.2);
    }, { passive:false });

    canvas.addEventListener('touchstart', e => {
        e.preventDefault(); activePanel=p;
        if (e.touches.length >= 2) {
            if (drawing) { drawing=false; ds[p].current=null; renderDrawings(p); }
            _startPinch(p, e);
        } else if (e.touches.length === 1 && !zm[p].pinching && !zm[p].justPinched) {
            _startDraw(p, e.touches[0]);
        }
    }, { passive:false });

    canvas.addEventListener('touchmove', e => {
        e.preventDefault();
        if (e.touches.length >= 2) _movePinch(p, e);
        else if (!zm[p].pinching && !zm[p].justPinched) _moveDraw(p, e.touches[0]);
    }, { passive:false });

    canvas.addEventListener('touchend', e => {
        e.preventDefault();
        if (zm[p].pinching) {
            if (e.touches.length < 2) {
                zm[p].pinching = false;
                zm[p].justPinched = true;
                setTimeout(() => zm[p].justPinched = false, 300);
            }
        } else if (!zm[p].justPinched) {
            _endDraw(p, e.changedTouches[0]);
        }
    }, { passive:false });
}

function _getPos(p, ev) {
    const c = document.getElementById('canvas'+p);
    const r = c.getBoundingClientRect();
    return {
        x: (ev.clientX - r.left) * (c.width  / r.width),
        y: (ev.clientY - r.top)  * (c.height / r.height)
    };
}

function _startDraw(p, ev) {
    drawing = true;
    const { x, y } = _getPos(p, ev);
    const n = toNorm(p, x, y);
    ds[p].current = {
        type: tool, color, size: brushSize,
        x1: n.x, y1: n.y, x2: n.x, y2: n.y,
        pts: (tool === 'pen' || tool === 'eraser') ? [{ x:n.x, y:n.y }] : undefined
    };
    scheduleRender(p);
}

function _moveDraw(p, ev) {
    if (!drawing || activePanel !== p || !ds[p].current) return;
    const { x, y } = _getPos(p, ev);
    const n = toNorm(p, x, y);
    const cur = ds[p].current;
    cur.x2 = n.x; cur.y2 = n.y;
    if (cur.pts) cur.pts.push({ x:n.x, y:n.y });
    scheduleRender(p);
}

function _endDraw(p, ev) {
    if (!drawing || activePanel !== p) return;
    drawing = false;
    const { x, y } = _getPos(p, ev);
    const n = toNorm(p, x, y);
    const cur = ds[p].current;
    if (cur) {
        cur.x2 = n.x; cur.y2 = n.y;
        if (cur.pts) cur.pts.push({ x:n.x, y:n.y });
        // Only save if has visible content
        const hasPts  = cur.pts && cur.pts.length > 0;
        const hasDist = Math.hypot(cur.x2 - cur.x1, cur.y2 - cur.y1) > 0.0005;
        if (hasPts || hasDist) ds[p].objects.push(cur);
    }
    ds[p].current = null;
    scheduleRender(p);
}

function undoDraw() {
    const s = ds[activePanel];
    if (!s.objects.length) { showToast('これ以上元に戻せません'); return; }
    s.objects.pop();
    renderDrawings(activePanel);
    showToast('元に戻しました');
}

function clearPanelDraw(p) {
    ds[p].objects = []; ds[p].current = null;
    renderDrawings(p);
    activePanel = p;
    showToast(`パネル ${p===1?'A':'B'} の描画をクリア`);
}

// ════════════════════════════════════════
// TOOLS / COLOR
// ════════════════════════════════════════
function setTool(t) {
    tool = t;
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tool-'+t)?.classList.add('active');
    document.body.className = document.body.className.replace(/\btool-\S+/g,'').trim() + ' tool-' + t;

    el.classList.add('active');
}

// ════════════════════════════════════════
// FRAME TIMESTAMP CACHE
// Built during rVFC callbacks while video plays.
// Provides actual frame timestamps for precise seeking.
// ════════════════════════════════════════
const MAX_CACHE = 600; // max timestamps to keep in memory per panel

function cacheFrameTime(p, t) {
    const times = frameCache[p].times;
    // Only add if meaningfully different from last entry (>0.1ms gap)
    if (times.length === 0 || t > times[times.length - 1] + 0.0001) {
        times.push(t);
        // Keep memory bounded: trim oldest half when full
        if (times.length > MAX_CACHE * 2) {
            frameCache[p].times = times.slice(MAX_CACHE);
        }
    }
}

// Return the next frame time after `currentTime`.
// Priority: container PTS array (authoritative) → fps-based estimate
// NOTE: rVFC frame cache is NOT used here — it is incomplete for high-fps
//       videos on 60Hz displays and should not be treated as a frame list.
function getNextFrameTime(p, currentTime) {
    // 1. Container PTS array (authoritative)
    const pts = mp4Analysis[p].pts;
    if (pts && pts.length > 1) {
        let lo = 0, hi = pts.length;
        while (lo < hi) {
            const mid = (lo + hi) >>> 1;
            if (pts[mid] <= currentTime + 0.0001) lo = mid + 1;
            else hi = mid;
        }
        if (lo < pts.length) return pts[lo];
    }
    // 2. fps-based estimate fallback
    // Use container fps if available, otherwise rVFC estimate, otherwise 30
    const fps = mp4Analysis[p].fps || panelState[p].fps || 30;
    if (fps === 29.97) return currentTime + 1001 / 30000;
    if (fps === 59.94) return currentTime + 1001 / 60000;
    return currentTime + 1 / fps;
}

// Return the previous frame time before `currentTime`.
function getPrevFrameTime(p, currentTime) {
    // 1. Container PTS array (authoritative)
    const pts = mp4Analysis[p].pts;
    if (pts && pts.length > 1) {
        let lo = 0, hi = pts.length;
        while (lo < hi) {
            const mid = (lo + hi) >>> 1;
            if (pts[mid] < currentTime - 0.0001) lo = mid + 1;
            else hi = mid;
        }
        if (lo > 0) return pts[lo - 1];
    }
    // 2. fps-based estimate fallback
    const fps = mp4Analysis[p].fps || panelState[p].fps || 30;
    if (fps === 29.97) return Math.max(0, currentTime - 1001 / 30000);
    if (fps === 59.94) return Math.max(0, currentTime - 1001 / 60000);
    return Math.max(0, currentTime - 1 / fps);
}

// ════════════════════════════════════════
// FRAME STEPPING
// Uses frame cache for precision when available.
// Falls back to fps-based estimate when cache is empty.
// ════════════════════════════════════════
// fromLP=true: called from long-press REPEAT interval
//   → skip this tick if seeking (never accumulate in pendingSteps)
// fromLP=false: called from initial tap
//   → queue ONE pending step if seeking (applied on 'seeked')
function stepPanelFrame(p, n, fromLP) {
    const vid = document.getElementById('video'+p);
    if (!vid.src || !vid.duration) return;

    vid.pause();

    if (vid.seeking) {
        if (!fromLP) {
            // Single-tap: buffer ONE step (capped to avoid unbounded growth)
            if (Math.sign(n) !== Math.sign(pendingSteps[p] || 0)) pendingSteps[p] = 0;
            pendingSteps[p] = (pendingSteps[p] || 0) + n;
            if (Math.abs(pendingSteps[p]) > Math.abs(n) * 3) pendingSteps[p] = n; // cap
        }
        // fromLP=true: silently skip this tick — do NOT accumulate
        return;
    }

    // Apply any pending steps from prior single-tap buffering
    const totalN = n + (pendingSteps[p] || 0);
    pendingSteps[p] = 0;
    if (totalN === 0) return;

    const tStep = performance.now();

    if (syncMode && mode === 'ab') {
        // Sync mode: calculate time delta, then apply to both panels
        let targetTime = vid.currentTime;
        for (let i = 0; i < Math.abs(totalN); i++) {
            targetTime = totalN > 0
                ? getNextFrameTime(p, targetTime)
                : getPrevFrameTime(p, targetTime);
        }
        const dt = targetTime - vid.currentTime;
        _stepSync(p, dt);
    } else {
        let targetTime = vid.currentTime;
        for (let i = 0; i < Math.abs(totalN); i++) {
            targetTime = totalN > 0
                ? getNextFrameTime(p, targetTime)
                : getPrevFrameTime(p, targetTime);
        }
        vid.currentTime = Math.max(0, Math.min(vid.duration, targetTime));
    }

    // Record step timing for debug panel
    const stepMs = performance.now() - tStep;
    const st = stepTiming[p];
    st.push(stepMs);
    if (st.length > 20) st.shift();
}

// Step both panels maintaining sync anchor offset
function _stepSync(primaryP, dt) {
    const v1 = document.getElementById('video1');
    const v2 = document.getElementById('video2');

    // Pause both
    if (v1.src && v1.duration) v1.pause();
    if (v2.src && v2.duration) v2.pause();

    if (primaryP === 1 && v1.duration) {
        const t1 = Math.max(0, Math.min(v1.duration, v1.currentTime + dt));
        v1.currentTime = t1;
        if (v2.duration) {
            const t2 = (syncPoints[1] !== null && syncPoints[2] !== null)
                ? syncPoints[2] + (t1 - syncPoints[1])
                : v2.currentTime + dt;
            v2.currentTime = Math.max(0, Math.min(v2.duration, t2));
        }
    } else if (primaryP === 2 && v2.duration) {
        const t2 = Math.max(0, Math.min(v2.duration, v2.currentTime + dt));
        v2.currentTime = t2;
        if (v1.duration) {
            const t1 = (syncPoints[1] !== null && syncPoints[2] !== null)
                ? syncPoints[1] + (t2 - syncPoints[2])
                : v1.currentTime + dt;
            v1.currentTime = Math.max(0, Math.min(v1.duration, t1));
        }
    }
}

// ════════════════════════════════════════
// SYNC POINTS
// ════════════════════════════════════════
function setSyncPoint(p) {
    const vid = document.getElementById('video'+p);
    if (!vid.duration) { showToast('動画を読み込んでください'); return; }
    syncPoints[p] = vid.currentTime;
    const btn = document.getElementById('spBtn'+p);
    if (btn) {
        btn.innerHTML = `📌 ${p===1?'A':'B'}<br><span style="font-size:9px;line-height:1">${ft(syncPoints[p])}</span>`;
        btn.classList.add('active');
    }
    _updateSyncDot(p);
    showToast(`📌 ${p===1?'A':'B'} 基準点: ${ft(syncPoints[p])}`);
}

function resetSyncPoints() {
    syncPoints[1] = null; syncPoints[2] = null;
    ['spBtn1','spBtn2'].forEach((id, i) => {
        const btn = document.getElementById(id);
        if (btn) { btn.innerHTML = `📌 ${i===0?'A':'B'}`; btn.classList.remove('active'); }
    });
    _updateSyncDot(1); _updateSyncDot(2);
    showToast('同期基準点をリセット');
}

function _updateSyncDot(p) {
    const vid = document.getElementById('video'+p);
    const dot = document.getElementById('sdot'+p);
    if (!dot) return;
    if (syncPoints[p] === null || !vid.duration) { dot.style.display = 'none'; return; }
    dot.style.left    = (syncPoints[p] / vid.duration * 100) + '%';
    dot.style.display = 'block';
}

function toggleSync() {
    syncMode = !syncMode;
    document.getElementById('syncBtn').classList.toggle('active', syncMode);
    if (syncMode && (syncPoints[1] === null || syncPoints[2] === null)) {
        showToast('同期 ON (📌 で基準点を設定すると精度向上)');
    } else {
        showToast(syncMode ? '同期 ON' : '同期 OFF');
    }
}

// ════════════════════════════════════════
// ZOOM
// ════════════════════════════════════════
function toggleZoomPopup() {
    zoomPopupOpen = !zoomPopupOpen;
    document.getElementById('zoomPopup').classList.toggle('hidden', !zoomPopupOpen);
    if (zoomPopupOpen) _updateZoomPopup(activePanel);
}
function hideZoomPopup() { zoomPopupOpen=false; document.getElementById('zoomPopup').classList.add('hidden'); }
function _updateZoomPopup(p) {
    const pct = Math.round(zm[p].scale * 100);
    document.getElementById('zoomLabel').textContent = `ズーム: ${pct}%`;
    document.getElementById('zoomSlider').value = pct;
}
function adjustZoom(p, delta) {
    zm[p].scale = Math.max(0.5, Math.min(6, zm[p].scale + delta));
    _clampPan(p); _applyZoom(p);
}
function setZoomValue(p, pct) {
    zm[p].scale = Math.max(0.5, Math.min(6, pct / 100));
    _clampPan(p); _applyZoom(p);
}
function resetZoom(p) {
    zm[p].scale = 1; zm[p].panX = 0; zm[p].panY = 0;
    _applyZoom(p); showToast('ズームをリセット'); hideZoomPopup();
}
function _clampPan(p) {
    const z = zm[p], w = document.getElementById('wrapper'+p);
    const W = w.offsetWidth, H = w.offsetHeight;
    const mx = W*(z.scale-1)/2, my = H*(z.scale-1)/2;
    z.panX = Math.max(-mx, Math.min(mx, z.panX));
    z.panY = Math.max(-my, Math.min(my, z.panY));
}
function _applyZoom(p) {
    const z = zm[p];
    // The zoom-wrap (containing both video + canvas) is CSS-transformed.
    // Both elements scale together, so drawings stay aligned with video content.
    document.getElementById('zoom'+p).style.transform =
        `translate(${z.panX}px,${z.panY}px) scale(${z.scale})`;
    const pct = Math.round(z.scale * 100);
    const ind = document.getElementById('zind'+p);
    ind.textContent  = pct + '%';
    ind.className    = 'zoom-badge' + (z.scale !== 1 ? ' zoomed' : '');
    if (zoomPopupOpen) _updateZoomPopup(activePanel);
}

// Pinch helpers
function _touchDist(e) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    return Math.sqrt(dx*dx + dy*dy);
}
function _touchMid(e) {
    return {
        x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
        y: (e.touches[0].clientY + e.touches[1].clientY) / 2
    };
}
function _startPinch(p, e) {
    const z = zm[p]; z.pinching=true; z.lastDist=_touchDist(e);
    const m = _touchMid(e); z.lastMidX=m.x; z.lastMidY=m.y;
}
function _movePinch(p, e) {
    const z = zm[p]; if (!z.pinching) return;
    const nd = _touchDist(e), m = _touchMid(e);
    z.scale  = Math.max(0.5, Math.min(6, z.scale * (nd / z.lastDist)));
    z.panX  += m.x - z.lastMidX; z.panY += m.y - z.lastMidY;
    z.lastDist=nd; z.lastMidX=m.x; z.lastMidY=m.y;
    _clampPan(p); _applyZoom(p);
}

// ════════════════════════════════════════
// VIDEO EVENTS
// ════════════════════════════════════════
function initVideoEvents(p) {
    const vid  = document.getElementById('video'+p);
    const seek = document.getElementById('seek'+p);

    vid.addEventListener('timeupdate', () => {
        if (seekingPanel === p) return;
        seek.value = vid.duration ? vid.currentTime / vid.duration * 1000 : 0;
        updateTime(p);
        _updateSyncDot(p);

        // Sync: panel 1 drives panel 2 during playback
        if (syncMode && mode === 'ab' && p === 1) {
            const v2 = document.getElementById('video2');
            if (v2.duration) {
                let t2;
                if (syncPoints[1] !== null && syncPoints[2] !== null) {
                    t2 = syncPoints[2] + (vid.currentTime - syncPoints[1]);
                } else {
                    t2 = vid.currentTime;
                }
                t2 = Math.max(0, Math.min(v2.duration, t2));
                // Only seek if difference is significant (avoid micro-seek loops)
                if (Math.abs(v2.currentTime - t2) > 0.08) v2.currentTime = t2;
            }
        }
    });

    seek.addEventListener('input', () => {
        seekingPanel = p;
        if (vid.duration) vid.currentTime = (seek.value / 1000) * vid.duration;
        updateTime(p);
    });
    seek.addEventListener('change', () => { seekingPanel = 0; });

    vid.addEventListener('play', () => {
        updatePlayBtns(p);
        if (!panelState[p].fpsDetected && !panelState[p].detecting) {
            // First play: run full detection (12 frames) + cache building
            panelState[p].detecting = true;
            startFPSDetection(p);
        } else if (panelState[p].fpsDetected || panelState[p].isVFR) {
            // Detection already done: resume continuous cache building
            _continueCaching(p);
        }
    });
    vid.addEventListener('pause', () => updatePlayBtns(p));
    vid.addEventListener('ended', () => updatePlayBtns(p));

    // Apply any frame steps that were buffered while vid.seeking was true
    vid.addEventListener('seeked', () => {
        const steps = pendingSteps[p];
        if (steps) {
            pendingSteps[p] = 0;
            stepPanelFrame(p, steps);
        }
    });
}

function updateTime(p) {
    const vid = document.getElementById('video'+p);
    document.getElementById('time'+p).textContent = `${ft(vid.currentTime)} / ${ft(vid.duration||0)}`;
}
function ft(s) {
    if (!isFinite(s) || s < 0) return '0:00';
    return `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`;
}
function updatePlayBtns(p) {
    const paused = document.getElementById('video'+p).paused;
    const pb = document.getElementById('pplay'+p);
    if (pb) pb.textContent = paused ? '▶' : '⏸';
    const primary = (mode === 'b') ? 2 : 1;
    if (p === primary) document.getElementById('playBtn').textContent = paused ? '▶' : '⏸';
}

// ════════════════════════════════════════
// PLAYBACK
// ════════════════════════════════════════
function togglePanelPlay(p) {
    const vid = document.getElementById('video'+p);
    if (!vid.src || !vid.duration) { showToast('動画を読み込んでください'); return; }
    vid.paused ? vid.play() : vid.pause();
}
function setPanelSpeed(p, r) { document.getElementById('video'+p).playbackRate = parseFloat(r); }

function togglePlay() {
    const primary = (mode === 'b') ? 2 : 1;
    const vid = document.getElementById('video'+primary);
    if (!vid.src || !vid.duration) { showToast('動画を読み込んでください'); return; }
    const paused = vid.paused;
    paused ? vid.play() : vid.pause();
    if (syncMode && mode === 'ab') {
        const other = document.getElementById('video'+(primary===1?2:1));
        if (other.src && other.duration) paused ? other.play() : other.pause();
    }
}

// ════════════════════════════════════════
// DEBUG PANEL
// ════════════════════════════════════════
function toggleDebugPanel() {
    debugVisible = !debugVisible;
    document.getElementById('debugPanel').classList.toggle('hidden', !debugVisible);
    if (debugVisible) { updateDebugPanel(1); updateDebugPanel(2); }
}

function _fmtMs(ms) { return ms > 0 ? ms.toFixed(0) + 'ms' : '—'; }
function _fmtBytes(b) {
    if (!b) return '—';
    if (b > 1e9) return (b/1e9).toFixed(1)+'GB';
    if (b > 1e6) return (b/1e6).toFixed(1)+'MB';
    return (b/1024).toFixed(0)+'KB';
}

function updateDebugPanel(p) {
    if (!debugVisible) return;
    const a  = mp4Analysis[p];
    const lt = loadTiming[p];
    const ps = panelState[p];
    const st = stepTiming[p];
    const lbl = p === 1 ? 'A' : 'B';

    // Determine timing source display
    let fpsLine = '';
    if (a.status === 'done') {
        fpsLine = `fps=${a.fps||'VFR'} [container]`;
    } else if (ps.fpsDetected) {
        fpsLine = `fps≈${ps.fps} [rVFC推定・非確定]`;
    } else {
        fpsLine = `fps=未検出`;
    }

    const stepAvg = st.length
        ? (st.reduce((s,v)=>s+v,0)/st.length).toFixed(1)+'ms/step'
        : '—';

    const lines = [
        `${lbl}: ${a.status==='none'?'動画なし':''} ${_fmtBytes(lt.fileBytes)}`,
        `codec=${a.codec} ${fpsLine}`,
        a.status==='done' ? `frames=${a.frameCount} parse=${_fmtMs(a.parseMs)}` : `解析=${a.status}${a.error?' ('+a.error.slice(0,40)+')':''}`,
        `metadata=${_fmtMs(lt.metadataMs)} 1stFrame=${_fmtMs(lt.firstFrameMs)} canPlay=${_fmtMs(lt.canPlayMs)}`,
        `stepAvg=${stepAvg} (直近${st.length}回)`
    ];

    document.getElementById('dbg'+p).innerHTML =
        lines.map(l => `<div>${l}</div>`).join('');
}

function copyDebugInfo() {
    const lines = [];
    for (const p of [1, 2]) {
        const a  = mp4Analysis[p];
        const lt = loadTiming[p];
        const ps = panelState[p];
        const st = stepTiming[p];
        const lbl = p === 1 ? 'A' : 'B';
        lines.push(`=== Panel ${lbl} ===`);
        lines.push(`App: v${APP_VERSION}, UA: ${navigator.userAgent}`);
        lines.push(`File: ${_fmtBytes(lt.fileBytes)}`);
        lines.push(`Codec: ${a.codec}`);
        lines.push(`Container FPS: ${a.fps || (a.isVFR?'VFR':'?')} (${a.status})`);
        lines.push(`rVFC FPS estimate: ${ps.fpsDetected ? ps.fps : '未検出'} (非確定)`);
        lines.push(`Frames: ${a.frameCount}`);
        lines.push(`Parse time: ${_fmtMs(a.parseMs)}`);
        lines.push(`Load - metadata: ${_fmtMs(lt.metadataMs)}`);
        lines.push(`Load - 1st frame: ${_fmtMs(lt.firstFrameMs)}`);
        lines.push(`Load - canPlay: ${_fmtMs(lt.canPlayMs)}`);
        const avg = st.length ? (st.reduce((s,v)=>s+v,0)/st.length).toFixed(1) : '—';
        lines.push(`Step avg: ${avg}ms (${st.length}回計測)`);
        if (a.error) lines.push(`Error: ${a.error}`);
    }
    navigator.clipboard?.writeText(lines.join('\n'))
        .then(()=>showToast('デバッグ情報をコピーしました'))
        .catch(()=>showToast('コピー失敗 (HTTP環境ではclipboard不可)'));
}

// ════════════════════════════════════════
// SERVICE WORKER UPDATE
// ════════════════════════════════════════
function applySWUpdate() {
    if (pendingSW) {
        // Tell the waiting SW to skip waiting and become active.
        // The 'controllerchange' handler in INIT will then reload.
        pendingSW.postMessage({ type: 'SKIP_WAITING' });
    } else {
        location.reload();
    }
}

// ════════════════════════════════════════
// TOAST
// ════════════════════════════════════════
let _tt;
function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(_tt); _tt = setTimeout(() => el.classList.remove('show'), 2500);
}
</script>
